name: Update events

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright's Chromium (for JS-rendered sources)
        run: playwright install --with-deps chromium

      - name: Collect events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python scrape.py | tee run.log

      - name: Fail if nothing was collected
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('docs/events.json'))['events']))")
          echo "$COUNT events collected" >> $GITHUB_STEP_SUMMARY
          cat run.log >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" -eq 0 ]; then
            echo "Every source returned nothing - not overwriting the published calendar."
            exit 1
          fi

      - name: Commit updated calendar
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/events.json docs/events.ics
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Update events $(date -u +%F)"
          git push
