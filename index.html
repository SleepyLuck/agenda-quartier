<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda du quartier — Saint-Gilles</title>
<meta name="description" content="Tous les événements des associations du quartier de Saint-Gilles, rassemblés sur une page, avec ajout à votre agenda en un clic.">
<meta property="og:title" content="Agenda du quartier">
<meta property="og:description" content="Ce qui se passe autour de chez nous, rassemblé depuis les sites des associations du quartier.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#EDEDE6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231A2333'/%3E%3Crect x='5' y='7' width='9' height='4' fill='%23E8336D'/%3E%3Crect x='18' y='7' width='9' height='4' fill='%231B6FE0'/%3E%3Crect x='5' y='14' width='9' height='4' fill='%2300937A'/%3E%3Crect x='18' y='14' width='9' height='4' fill='%23E07A00'/%3E%3Crect x='5' y='21' width='22' height='4' fill='%23FAFAF7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEDE6; --sheet:#FAFAF7; --ink:#1A2333; --ink-soft:#5C6B80;
    --rule:#D6D6CB; --rule-strong:#B9B9AC; --focus:#1B6FE0;
    --sp:clamp(1rem,2.5vw,2rem);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Atkinson Hyperlegible",-apple-system,Segoe UI,sans-serif;
    font-size:16px; line-height:1.55;
  }
  a{color:inherit}
  button,select,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px}

  .wrap{max-width:1180px;margin:0 auto;padding:0 var(--sp) 5rem}

  /* masthead ------------------------------------------------------- */
  header.masthead{border-bottom:2px solid var(--ink);padding:2.4rem 0 1.1rem;margin-bottom:1.6rem}
  .masthead h1{
    font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
    font-size:clamp(2.4rem,7vw,4.6rem); line-height:.94; letter-spacing:-.02em;
    margin:0 0 .35rem;
  }
  .masthead p{margin:0;max-width:56ch;color:var(--ink-soft)}
  .masthead .meta{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:baseline;margin-top:1rem;font-size:.86rem;color:var(--ink-soft)}
  .linkish{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .linkish:hover{text-decoration-thickness:2px}

  /* controls ------------------------------------------------------- */
  .controls{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1.6rem}
  .field{display:flex;align-items:center;gap:.45rem;background:var(--sheet);border:1px solid var(--rule-strong);padding:.42rem .7rem}
  .field input{border:0;background:none;width:15ch;min-width:8ch}
  .field input::placeholder{color:var(--ink-soft)}
  .field select{border:0;background:none;cursor:pointer}
  .field label{font-size:.82rem;color:var(--ink-soft)}

  /* two-column ----------------------------------------------------- */
  .columns{display:grid;grid-template-columns:19rem 1fr;gap:calc(var(--sp) * 1.6);align-items:start}
  @media (max-width:860px){.columns{grid-template-columns:1fr;gap:2rem}}
  .rail{position:sticky;top:1rem}
  @media (max-width:860px){.rail{position:static}}

  /* month grid ----------------------------------------------------- */
  .monthbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.5rem}
  .monthbar h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:1.35rem;margin:0;letter-spacing:-.01em}
  .monthbar div{display:flex;gap:.15rem}
  .monthbar button{background:var(--sheet);border:1px solid var(--rule-strong);width:1.9rem;height:1.9rem;cursor:pointer;line-height:1}
  .monthbar button:hover{background:var(--ink);color:var(--sheet)}
  table.cal{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule-strong)}
  table.cal th{font-size:.68rem;font-weight:400;color:var(--ink-soft);padding:.35rem 0;border-bottom:1px solid var(--rule)}
  table.cal td{border:1px solid var(--rule);height:3.1rem;vertical-align:top;padding:.2rem .25rem}
  td.day{cursor:pointer}
  td.day:hover{background:#fff}
  td.out{background:#E9E9E1;color:#A9A99C;cursor:default}
  td.today{box-shadow:inset 0 0 0 2px var(--ink)}
  td.picked{background:#fff;box-shadow:inset 0 0 0 2px var(--focus)}
  .dnum{font-size:.72rem;color:var(--ink-soft)}
  .bars{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
  .bar{height:4px;width:9px}

  /* sources -------------------------------------------------------- */
  .rail h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:1rem;margin:1.8rem 0 .5rem}
  .src{display:flex;align-items:center;gap:.55rem;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:.5rem .1rem;cursor:pointer;text-align:left}
  .src .swatch{width:.85rem;height:.85rem;flex:none}
  .src .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
  .src .ct{font-size:.78rem;color:var(--ink-soft)}
  .src[aria-pressed="false"]{opacity:.4}
  .src[aria-pressed="false"] .swatch{background:transparent !important;box-shadow:inset 0 0 0 1px var(--ink-soft)}

  /* agenda --------------------------------------------------------- */
  .daygroup{margin-bottom:1.9rem;scroll-margin-top:1rem}
  .dayhead{display:flex;align-items:baseline;gap:.7rem;border-bottom:2px solid var(--ink);padding-bottom:.25rem;margin-bottom:.9rem}
  .dayhead .dd{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
  .dayhead .rest{color:var(--ink-soft);font-size:.92rem}
  .ev{display:grid;grid-template-columns:5.2rem 1fr;gap:.9rem;padding:.75rem 0;border-bottom:1px solid var(--rule)}
  @media (max-width:520px){.ev{grid-template-columns:1fr;gap:.25rem}}
  .ev .when{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.92rem;padding-top:.12rem}
  .ev h4{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:1.12rem;line-height:1.25;margin:0 0 .2rem}
  .ev .org{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--ink-soft)}
  .ev .org .swatch{width:.6rem;height:.6rem;flex:none}
  .ev .where{font-size:.85rem;color:var(--ink-soft)}
  .ev .desc{font-size:.9rem;margin:.35rem 0 0;max-width:62ch}
  .actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.55rem}
  .actions a,.actions button{
    background:var(--sheet);border:1px solid var(--rule-strong);padding:.3rem .6rem;
    font-size:.84rem;text-decoration:none;cursor:pointer;
  }
  .actions a:hover,.actions button:hover{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

  .empty{background:var(--sheet);border:1px dashed var(--rule-strong);padding:1.6rem;max-width:60ch}
  .empty h3{font-family:"Bricolage Grotesque",sans-serif;margin:0 0 .5rem}
  .empty code{background:#E4E4DA;padding:.1rem .3rem}
  .notice{background:#FFF7DB;border:1px solid #E3C766;padding:.7rem .9rem;margin-bottom:.7rem;font-size:.9rem}
  .notice.stale{background:#FDE7E7;border-color:#D98A8A}
  #notices:not(:empty){margin-bottom:1rem}
  .toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:.6rem 1rem;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <h1>Agenda du quartier</h1>
  <p id="tagline">Ce qui se passe autour de chez nous, rassemblé depuis les sites des associations du quartier.</p>
  <div class="meta">
    <span id="updated">Chargement…</span>
    <button class="linkish" id="subscribe">S'abonner à tout le calendrier</button>
    <button class="linkish" id="copyfeed">Copier le lien du flux</button>
  </div>
</header>

<div id="notices"></div>

<div class="controls">
  <div class="field">
    <input id="q" type="search" placeholder="Chercher un événement" aria-label="Chercher un événement">
  </div>
  <div class="field">
    <label for="remind">Rappel</label>
    <select id="remind">
      <option value="15">15 minutes avant</option>
      <option value="60">1 heure avant</option>
      <option value="120" selected>2 heures avant</option>
      <option value="1440">1 jour avant</option>
      <option value="0">Aucun</option>
    </select>
  </div>
  <div class="field">
    <label for="range">Période</label>
    <select id="range">
      <option value="all" selected>Tout ce qui vient</option>
      <option value="7">7 prochains jours</option>
      <option value="30">30 prochains jours</option>
    </select>
  </div>
</div>

<div class="columns">
  <aside class="rail">
    <div class="monthbar">
      <h2 id="monthname">—</h2>
      <div>
        <button id="prev" aria-label="Mois précédent">‹</button>
        <button id="next" aria-label="Mois suivant">›</button>
      </div>
    </div>
    <table class="cal"><thead><tr id="dow"></tr></thead><tbody id="grid"></tbody></table>
    <h3>Sources</h3>
    <div id="sources"></div>
  </aside>

  <main id="agenda" aria-live="polite"></main>
</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const TZ_LABEL = "Europe/Brussels";
const state = {data:null, hidden:new Set(), month:null, picked:null, q:"", range:"all"};

const pad = n => String(n).padStart(2,"0");
const dayKey = iso => { const d=new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDay = iso => new Date(iso).toLocaleDateString("fr-BE",{weekday:"long",month:"long",year:"numeric"});
const fmtTime = iso => new Date(iso).toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"});

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }

// ---------------------------------------------------------------- load
async function load(){
  try{
    const res = await fetch("events.json",{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    state.data = await res.json();
  }catch(err){
    document.getElementById("agenda").innerHTML =
      `<div class="empty"><h3>Pas encore de données</h3>
       <p>Le fichier <code>events.json</code> est introuvable. Lancez <code>python scrape.py</code>,
       puis rechargez cette page. En local, servez le dossier avec <code>python -m http.server</code> :
       ouvrir le fichier directement bloque le chargement.</p></div>`;
    document.getElementById("updated").textContent = "Aucune donnée";
    return;
  }
  const d = state.data;
  const notices = [];
  if(d.sample) notices.push(["", "Données d'exemple. Remplacez sources.yml par vos vraies sources, puis relancez scrape.py."]);

  const ageHours = (Date.now() - new Date(d.generated).getTime()) / 36e5;
  if(ageHours > 48) notices.push(["stale",
    `Dernière mise à jour il y a ${Math.floor(ageHours/24)} jours. La collecte automatique ne tourne plus : vérifiez l'onglet Actions du dépôt.`]);

  const silent = (d.sources||[]).filter(s => s.count === 0).map(s => s.name);
  if(silent.length) notices.push(["",
    `Aucun événement trouvé pour : ${silent.join(", ")}. Ces sites ont peut-être changé de structure — relancez probe.py.`]);

  const box = document.getElementById("notices");
  box.innerHTML = notices.map(([cls,msg]) => `<div class="notice ${cls}">${esc(msg)}</div>`).join("");
  document.getElementById("updated").textContent =
    `${d.events.length} événements · mis à jour le ${new Date(d.generated).toLocaleString("fr-BE",{dateStyle:"medium",timeStyle:"short"})}`;
  const now = new Date();
  const thisMonth = d.events.some(e => { const s=new Date(e.start);
    return s.getFullYear()===now.getFullYear() && s.getMonth()===now.getMonth(); });
  const anchor = thisMonth || !d.events[0] ? now : new Date(d.events[0].start);
  state.month = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  renderSources(); renderAll();
}

// ------------------------------------------------------------ filtering
function visible(){
  const q = state.q.trim().toLowerCase();
  const now = new Date();
  const limit = state.range === "all" ? null : new Date(now.getTime() + Number(state.range)*864e5);
  return state.data.events.filter(e=>{
    if(state.hidden.has(e.source)) return false;
    if(limit && new Date(e.start) > limit) return false;
    if(state.picked && dayKey(e.start) !== state.picked) return false;
    if(q && !(`${e.title} ${e.location} ${e.description} ${e.source}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

// -------------------------------------------------------------- sources
function renderSources(){
  const box = document.getElementById("sources");
  box.innerHTML = "";
  state.data.sources.forEach(s=>{
    const b = document.createElement("button");
    b.className = "src";
    b.setAttribute("aria-pressed", String(!state.hidden.has(s.name)));
    b.title = `${s.url}\nméthode : ${s.method}`;
    b.innerHTML = `<span class="swatch" style="background:${s.colour}"></span>
                   <span class="nm">${esc(s.name)}</span><span class="ct">${s.count}</span>`;
    b.onclick = ()=>{
      state.hidden.has(s.name) ? state.hidden.delete(s.name) : state.hidden.add(s.name);
      b.setAttribute("aria-pressed", String(!state.hidden.has(s.name)));
      renderAll();
    };
    box.appendChild(b);
  });
}

// ----------------------------------------------------------- month grid
function renderGrid(){
  const m = state.month, y = m.getFullYear(), mo = m.getMonth();
  document.getElementById("monthname").textContent =
    m.toLocaleDateString("fr-BE",{month:"long",year:"numeric"});
  const dow = document.getElementById("dow");
  dow.innerHTML = ["lu","ma","me","je","ve","sa","di"].map(d=>`<th>${d}</th>`).join("");

  const byDay = {};
  visible().forEach(e=>{ (byDay[dayKey(e.start)] ||= []).push(e); });

  const firstDow = (new Date(y,mo,1).getDay()+6)%7;      // Monday = 0
  const total = new Date(y,mo+1,0).getDate();
  const todayKey = dayKey(new Date().toISOString());
  let html = "", cell = 0, row = "";

  for(let i=0;i<firstDow;i++){ row += `<td class="out"></td>`; cell++; }
  for(let d=1; d<=total; d++){
    const key = `${y}-${pad(mo+1)}-${pad(d)}`;
    const evs = byDay[key] || [];
    const bars = evs.slice(0,6).map(e=>`<span class="bar" style="background:${e.colour}"></span>`).join("");
    const cls = ["day", key===todayKey?"today":"", key===state.picked?"picked":""].join(" ");
    row += `<td class="${cls}" data-key="${key}" tabindex="0" role="button"
             aria-label="${d} ${evs.length} événement(s)"><span class="dnum">${d}</span><div class="bars">${bars}</div></td>`;
    cell++;
    if(cell%7===0){ html += `<tr>${row}</tr>`; row=""; }
  }
  while(cell%7!==0){ row += `<td class="out"></td>`; cell++; }
  if(row) html += `<tr>${row}</tr>`;
  const grid = document.getElementById("grid");
  grid.innerHTML = html;
  grid.querySelectorAll("td.day").forEach(td=>{
    const pick = ()=>{
      state.picked = (state.picked === td.dataset.key) ? null : td.dataset.key;
      renderAll();
      const g = document.getElementById("d"+td.dataset.key);
      if(g) g.scrollIntoView({behavior:"smooth", block:"start"});
    };
    td.onclick = pick;
    td.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); pick(); } };
  });
}

// --------------------------------------------------------------- agenda
function renderAgenda(){
  const list = visible();
  const box = document.getElementById("agenda");
  if(!list.length){
    box.innerHTML = `<div class="empty"><h3>Rien à afficher</h3>
      <p>Aucun événement ne correspond aux filtres. Réactivez une source, videz la recherche
      ou cliquez de nouveau sur le jour sélectionné.</p></div>`;
    return;
  }
  const groups = {};
  list.forEach(e=>{ (groups[dayKey(e.start)] ||= []).push(e); });

  box.innerHTML = Object.keys(groups).sort().map(key=>{
    const label = fmtDay(groups[key][0].start);
    const parts = label.split(" ");
    return `<section class="daygroup" id="d${key}">
      <div class="dayhead"><span class="dd">${key.slice(8)}</span>
      <span class="rest">${esc(parts.slice(1).join(" "))} — ${esc(parts[0])}</span></div>
      ${groups[key].map(evHTML).join("")}
    </section>`;
  }).join("");

  box.querySelectorAll("button[data-uid]").forEach(b=>{
    b.onclick = ()=> downloadICS(state.data.events.find(e=>e.uid===b.dataset.uid));
  });
}

function evHTML(e){
  const when = e.all_day ? "toute la journée"
    : fmtTime(e.start) + (e.end && dayKey(e.end)===dayKey(e.start) ? "–"+fmtTime(e.end) : "");
  return `<article class="ev">
    <div class="when">${when}</div>
    <div>
      <h4>${esc(e.title)}</h4>
      <div class="org"><span class="swatch" style="background:${e.colour}"></span>${esc(e.source)}</div>
      ${e.location ? `<div class="where">${esc(e.location)}</div>` : ""}
      ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ""}
      <div class="actions">
        <button data-uid="${e.uid}">Ajouter à mon agenda</button>
        <a href="${esc(e.url)}" target="_blank" rel="noopener">Voir sur le site</a>
      </div>
    </div>
  </article>`;
}

// ------------------------------------------------------------------ ICS
function icsStamp(iso, allDay){
  const d = new Date(iso);
  if(allDay) return ";VALUE=DATE:" + d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  return ":" + d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
}
const icsEsc = s => String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");

function downloadICS(e){
  if(!e) return;
  const mins = Number(document.getElementById("remind").value);
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//agenda-du-quartier//EN","BEGIN:VEVENT",
    "UID:"+e.uid+"@agenda-du-quartier",
    "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),
    "DTSTART"+icsStamp(e.start,e.all_day)];
  if(e.end) L.push("DTEND"+icsStamp(e.end,e.all_day));
  L.push("SUMMARY:"+icsEsc(e.title));
  if(e.location) L.push("LOCATION:"+icsEsc(e.location));
  if(e.url) L.push("URL:"+e.url);
  L.push("DESCRIPTION:"+icsEsc([e.description, e.url].filter(Boolean).join("\n")));
  if(mins > 0) L.push("BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT"+mins+"M",
                      "DESCRIPTION:"+icsEsc(e.title),"END:VALARM");
  L.push("END:VEVENT","END:VCALENDAR");
  const blob = new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = e.title.replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,50).replace(/^-|-$/g,"") + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("Fichier .ics téléchargé — ouvrez-le pour l'ajouter à votre agenda");
}

const feedURL = () => new URL("events.ics", location.href).href;

// ------------------------------------------------------------------ misc
const esc = s => String(s??"").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderAll(){ renderGrid(); renderAgenda(); }

document.getElementById("prev").onclick = ()=>{ state.month.setMonth(state.month.getMonth()-1); renderGrid(); };
document.getElementById("next").onclick = ()=>{ state.month.setMonth(state.month.getMonth()+1); renderGrid(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; renderAll(); };
document.getElementById("range").onchange = e => { state.range = e.target.value; renderAll(); };
document.getElementById("subscribe").onclick = ()=>{
  location.href = feedURL().replace(/^https?:/, "webcal:");
};
document.getElementById("copyfeed").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(feedURL()); toast("Lien du flux copié"); }
  catch{ prompt("Copiez ce lien :", feedURL()); }
};

load();
</script>
</body>
</html>
