# Hand-curated events - printed flyers, photographed programmes, festival
# sites that don't publish a scrapable agenda, or pages outside this
# sandbox's reach. Not tied to any sources.yml entry: scrape.py's
# load_manual_events() reads this file directly and merges it into every
# run's output (aged out by the normal date window like anything else), so
# add a new entry here rather than editing docs/events.json by hand - a
# direct edit there would just be overwritten by the next scheduled run.
#
# Required per entry: title, start, source. Optional: end, all_day,
# location, description, url, category (one of extract.py's CATEGORIES
# ids, else "other"), tags (any of extract.py's TAG_IDS, invalid ones are
# dropped). `verification` and `note` are free-text provenance for whoever
# maintains this file - how the date/time/venue was confirmed, and any
# caveat about reading it off a photo or an unreachable site. Not shown on
# the public site; kept here so a stale or uncertain entry can be found and
# rechecked later. `series` groups an event with its sibling entries from
# the same festival/programme - also not surfaced publicly yet.

