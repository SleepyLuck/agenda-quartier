# Each entry = one organisation you want to follow.
#
# name   : shown on the page and in the calendar
# url    : the page that actually lists events
# method : auto | ics | wordpress | jsonld | llm
#          auto -> tries ics, wordpress, jsonld, then llm (if API key set)
# colour : optional hex; otherwise assigned from the palette
#
# Run `python probe.py --all` before trusting any of this.

defaults:
  timezone: Europe/Brussels
  respect_robots: true
  request_delay_seconds: 1.5
  horizon_days: 120
  keep_past_days: 1
  llm_model: claude-haiku-4-5-20251001   # check current model names in the API docs

sources:
  # --- La Vieille Chéchette, rue du Monténégro 2-6 ------------------------
  # Checked live via probe.py on 31/08/2026 (an earlier note here about the
  # domain resolving to a Home Depot clone no longer holds — the real site is
  # back, WordPress 6.9). The Events Calendar REST API 404s (plugin not
  # installed), but the page embeds 4 schema.org Event nodes in ld+json, so
  # `jsonld` is the rung that actually works here — `auto` will reach it.
  - name: La Vieille Chéchette
    url: https://chechette.be/lagenda/
    method: auto
    colour: "#E8336D"

  # --- GC Pianofabriek, Fortstraat 35 ------------------------------------
  # Checked live via probe.py on 31/08/2026: robots.txt actually allows
  # crawling (an earlier note here saying it was disallowed no longer
  # holds), but that doesn't matter — the page has 0 ld+json Event nodes and
  # ~0 date-like strings in its rendered text, meaning the agenda is filled
  # in by JavaScript after load. No rung here (ics/wordpress/jsonld/llm) can
  # see it; the LLM rung would just get an empty page. Their events are also
  # published to UiTdatabank (publiq), which has a proper public API and is
  # the polite, working route — not yet wired up in extract.py.
  - name: GC Pianofabriek
    url: https://www.pianofabriek.be/activiteiten
    method: auto
    colour: "#1B6FE0"

  # --- La Tricoterie, rue Théodore Verhaegen 158 -------------------------
  # Checked live via probe.py on 31/08/2026. URL parameters (?id_mot=,
  # &jour=, &debut_partenaires=) are the SPIP CMS signature; SPIP emits no
  # schema.org data, confirmed (0 ld+json Event nodes). robots.txt disallows
  # ClaudeBot/GPTBot/ChatGPT-User/CCBot by name but not this scraper's own
  # identified UA. The page text has ~586 date-like strings, so the `llm`
  # rung should work well here — it just needs ANTHROPIC_API_KEY set as a
  # repository secret, which it currently isn't.
  - name: La Tricoterie
    url: https://www.tricoterie.be/fr/agenda/l-agenda-culturel/?lang=fr
    method: auto
    colour: "#00937A"
