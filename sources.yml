  - name: Théâtre National Wallonie-Bruxelles
    url: https://www.theatrenational.be/en/program/
    method: llm

  - name: La Bellone
    url: https://bellone.be/
    method: llm

  # Named distinctly from the "FTI Brussel" manual source (manual_events.yml) -
  # sharing a name with a manual source confused the carry-forward/dedup logic
  # (fixed in scrape.py), but kept the names apart too to avoid two identically
  # named entries in the UI's source list.
  - name: FTI Brussel (programme page)
    url: https://www.ftifestival.be/programma/brussel
