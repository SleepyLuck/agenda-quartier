  # NOTE: URL is month-specific (.../agenda-engage-<month>-2026/) - needs
  # updating by hand each month.
  - name: Agenda engagé (Syndicats magazine)
    url: https://syndicatsmagazine.be/agenda-engage-octobre-2026/
