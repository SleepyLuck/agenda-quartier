# Each entry = one organisation you want to follow.
#
# name   : shown on the page and in the calendar
# url    : the page that actually lists events
# method : auto | ics | wordpress | jsonld | llm
#          auto -> tries ics, wordpress, jsonld, then llm (if API key set)
# colour : optional hex; otherwise assigned from the palette
#
# Run `python probe.py --all` before trusting any of this.

defaults:
  timezone: Europe/Brussels
  respect_robots: true
  request_delay_seconds: 1.5
  horizon_days: 120
  keep_past_days: 1
  llm_model: claude-haiku-4-5   # check current model names in the API docs

sources:
  # --- La Vieille Chéchette, rue du Monténégro 2-6 ------------------------
  # Checked live via probe.py on 31/08/2026 (an earlier note here about the
  # domain resolving to a Home Depot clone no longer holds — the real site is
  # back, WordPress 6.9). The Events Calendar REST API 404s (plugin not
  # installed), but the page embeds 4 schema.org Event nodes in ld+json, so
  # `jsonld` is the rung that actually works here — `auto` will reach it.
  - name: La Vieille Chéchette
    url: https://chechette.be/lagenda/
    method: auto
    colour: "#E8336D"

  # --- GC Pianofabriek, Fortstraat 35 ------------------------------------
  # robots.txt allows crawling. The agenda is filled in by JavaScript after
  # load (confirmed via probe.py: 0 ld+json Event nodes, ~0 date-like
  # strings in the plain-fetch text), so ics/wordpress/jsonld/llm on the raw
  # HTML all find nothing. UiTdatabank (an earlier note here suggested it)
  # turned out not to be a free fix — no reference to it anywhere in this
  # page's own HTML/JS, and its public search API requires a developer key.
  # method: browser (verified 31/08/2026) renders the page with headless
  # Chromium first, which does surface real events with clean dates
  # ("za 12.09.2026" etc.), then runs jsonld/llm extraction against the
  # rendered HTML. Needs ANTHROPIC_API_KEY, same as the plain llm rung.
  - name: GC Pianofabriek
    url: https://www.pianofabriek.be/activiteiten
    method: browser
    colour: "#1B6FE0"

  # --- La Tricoterie, rue Théodore Verhaegen 158 -------------------------
  # Checked live via probe.py on 31/08/2026. URL parameters (?id_mot=,
  # &jour=, &debut_partenaires=) are the SPIP CMS signature; SPIP emits no
  # schema.org data, confirmed (0 ld+json Event nodes). robots.txt disallows
  # ClaudeBot/GPTBot/ChatGPT-User/CCBot by name but not this scraper's own
  # identified UA. The page text has ~586 date-like strings, so the `llm`
  # rung should work well here — it just needs ANTHROPIC_API_KEY set as a
  # repository secret, which it currently isn't.
  - name: La Tricoterie
    url: https://www.tricoterie.be/fr/agenda/l-agenda-culturel/?lang=fr
    method: auto
    colour: "#00937A"

  # --- Batch of 35 candidate venues, checked 31/08/2026 via a discovery ---
  # script run on GitHub's runner (this sandbox has no general web access).
  # For each: does the domain resolve, does the title match the venue, and
  # is there a findable agenda page. 19 came back clean and are below with
  # their real agenda URL. 13 hit a dead/parked domain or failed DNS
  # entirely and are NOT added - the user needs to supply the real URL for:
  # Maison des Cultures de Saint-Gilles, Maison du Peuple (parked domain),
  # Maison du Livre (parked/firewalled domain), Cellule 133, Petit Kings
  # Comedy Club, Garage Cultural, Maison Hannon, Passerelle Louise,
  # CréaNova, Fondation A Stichting, Théâtre Mercelis, Théâtre de la Toison
  # d'Or (parked domain), La Madeleine (SSL error). 3 more are ambiguous and
  # not added either: Musée Horta (real site, but no agenda page found -
  # might just not run a rotating events programme), Maxima (resolves to
  # Communa's page *about* the venue, not clearly an events listing), CIVA
  # (civa.brussels redirects to kanal.brussels - possibly a real
  # rebrand/merger, possibly wrong; needs confirming before scraping it as
  # "CIVA"). method: auto for all except GC Ten Weyngaert, which fingerprints
  # as the exact same Drupal 10 + Commerce 3 stack as GC Pianofabriek - a
  # strong signal it's JS-rendered too, so it starts on method: browser.

  - name: Recyclart
    url: https://recyclart.be/fr/agenda
    method: auto

  - name: Le Jacques Franck
    url: https://www.lejacquesfranck.be/agenda
    method: auto

  - name: Fuse
    url: https://www.fuse.be/events
    method: auto

  - name: Goudblommeke in Papier
    url: https://goudblommekeinpapier.be/agenda/
    method: auto

  - name: Le Poche
    url: https://poche.be/shows
    method: auto

  - name: Sounds Jazz Club
    url: https://www.sounds.brussels/agenda/
    method: auto

  - name: U-Square
    url: https://usquare.brussels/en/agenda
    method: auto

  - name: BRASS
    url: https://www.lebrass.be/
    method: auto

  # Confirmed 01/09/2026 via a live diagnostic: the plain-fetch HTML is
  # 181KB but strips down to just 7.4KB of real text with zero event
  # content ("nocturne" - a real upcoming event the user named - appears
  # nowhere in it). Same JS-rendered-client-side signature as GC
  # Pianofabriek/GC Ten Weyngaert, so the same fix applies: browser.
  - name: WIELS
    url: https://wiels.org/en/events
    method: browser

  - name: Maison Poème
    url: https://maisonpoeme.be/
    method: auto

  - name: CCLJ
    url: https://cclj.be/notre-agenda/
    method: auto

  - name: GC Ten Weyngaert
    url: https://www.tenweyngaert.be/activiteiten
    method: browser

  # Re-probed 2026-10-03 after showing up in the "no events found" notice:
  # robots OK, page fetches fine, but 0 date-like strings in static HTML and
  # Park Poétik's own programme is summer-only (confirmed via search) - this
  # is very likely a real, seasonal empty agenda right now, not a scraper
  # bug. Left on auto; revisit if it's still empty once summer programming
  # would normally be announced.
  - name: Park Poétik
    url: https://parkpoetik.be/nl/agenda/
    method: auto

  # Re-probed 2026-10-03: 0 date-like strings in static HTML (was timing out
  # before; now returns 200 but empty) - the agenda is rendered client-side.
  # method: browser (was auto/llm, which would only ever see the empty shell).
