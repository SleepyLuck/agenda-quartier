  # --- Candidates added 2026-10-01, verified via probe.py over two GitHub
  # Actions runs (65 candidates probed total; these 20 are the ones that
  # returned real signal and are not robots/firewall-blocked). ----------

  # Real .ics feed, 36 events found live. method: ics fetches source url
  # directly as an ics file (no feed auto-discovery from an HTML page), so
  # url must be the feed itself, not the site's homepage.
  - name: Demosphere Bruxelles
    url: https://bxl.demosphere.net/events.ics
    method: ics

  # .ics feed (14 events), wordpress REST (5) and jsonld (12) all hit -
  # richest signal of the whole batch. method: ics fetches source url
  # directly as an ics file, so url must be the feed itself.
  - name: CBCS (Brussels social sector agenda)
    url: https://cbcs.be/agenda/?ical=1
    method: ics

  # jsonld: 10 schema.org Event nodes (region-wide page covers Saint-Gilles
  # and Forest brocantes too, so the narrower per-commune pages weren't
  # added separately - would just double-count the same listings).
  - name: Quefaire.be brocantes (Brussels region)
    url: https://www.quefaire.be/brocantes/region-de-bruxelles
    method: jsonld

  # jsonld: 40 Event nodes. NOTE: URL is month-specific
  # (.../belgique/<month>/) - needs updating by hand each month.
  - name: Brocabrac Belgique
    url: https://brocabrac.fr/belgique/novembre/
    method: jsonld

  # Meetup.com embeds jsonld Event nodes (4 found).
  - name: Brussels Language Meetup
    url: https://www.meetup.com/brussels-language-meetup/
    method: jsonld

  - name: Brussels International Hub Events (Meetup)
    url: https://www.meetup.com/brusselsinternationalhubevents/
    method: jsonld

  # The rest: no feed/jsonld, but the plain-fetch text has real,
  # dense date-like content for the llm rung once the API key works again.
  - name: Saint-Gilles brocantes & braderies (commune)
    url: https://stgilles.brussels/services/developpement-economique/service-du-developpement-economique/brocantes-braderies-marches-etalages-et-chevalets/
    method: llm

  - name: Maison des Cultures de Saint-Gilles
    url: https://mdc1060.brussels/
    method: llm

  - name: Le Rideau
    url: https://lerideau.brussels/spectacles/saison/2026-2027
